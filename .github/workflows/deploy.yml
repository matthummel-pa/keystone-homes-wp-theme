name: Deploy theme zip

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: theme-latest-zip
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Build & publish theme-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install npm dependencies
        run: npm ci

      - name: Pack WordPress theme zip
        run: bash bin/build-theme-zip.sh

      - name: Pack general install zip (seller / regular host)
        run: SKIP_THEME_BUILD=1 bash bin/build-install-pack.sh

      - name: Publish GitHub Release (theme-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: theme-latest
          name: Latest theme build
          body: |
            Built Sage theme (Composer vendor + Vite `public/build`).
            Commit: ${{ github.sha }}

            Regular WordPress install: download `acreline-*.zip`, extract it, then Appearance → Themes → Upload Theme and choose the inner `keystone-homes.zip`.
            Host update: Appearance → Update Theme (theme zip only).
          files: |
            dist-theme/keystone-homes.zip
            dist-install/acreline-*.zip
          fail_on_unmatched_files: true
          make_latest: true
          target_commitish: ${{ github.sha }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystone-homes-theme
          path: dist-theme/keystone-homes.zip
          if-no-files-found: error
